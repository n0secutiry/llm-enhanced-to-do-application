[project]
name = "llm-enhanced-to-do-application"
version = "0.1.0"
description = "none"
readme = "README.md"
authors = [
    { name = "n0secutiry" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[all]>=0.141.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.1",
    "uvicorn>=0.53.0",
]

[project.scripts]
llm-enhanced-to-do-application = "llm_enhanced_to_do_application:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "ASYNC", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
